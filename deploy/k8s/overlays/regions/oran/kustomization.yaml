apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Région Oran — REPLICA (Phase 20.1). Lectures locales sur la réplique
# Postgres, écritures relayées vers le primary (Alger).
namespace: medanki-oran

resources:
  - ../../prod

commonLabels:
  medanki.io/region: oran

patches:
  - target:
      kind: ConfigMap
      name: medanki-config
    patch: |-
      - op: add
        path: /data/region
        value: oran
      - op: add
        path: /data/region-role
        value: replica
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MEDANKI_REGION
          value: oran
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MEDANKI_REGION_ROLE
          value: replica
  - target:
      kind: HorizontalPodAutoscaler
      name: backend-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 12
