# Phase 17.1 — Secrets prod (template, à remplir par Vault/SOPS).
#
# IMPORTANT : ce fichier est un TEMPLATE. Les vraies valeurs
# sont injectées par External Secrets Operator (ESO) depuis
# Vault ou par Sealed Secrets. Ne JAMAIS committer de vraies
# valeurs.
#
# Format des secrets (cf. backend/src/billing/chargily.provider.ts,
# backend/src/auth/jwt.guard.ts, etc.) :
#   * database-url : postgres://user:pass@postgres-primary:5432/medanki
#   * jwt-signing-key : PEM PKCS8 privé (RS256, 2048+ bits)
#   * jwt-public-key : PEM SPKI public
#   * postgres-password : mot de passe postgres
#   * chargily-api-key : pk_live_xxx
#   * chargily-api-secret : sk_live_xxx
#   * sentry-dsn : https://...@sentry.io/12345
#   * r2-access-key : AKIA...
#   * r2-secret-key : ...
#   * otel-endpoint : http://otel-collector.observability:4317
#   * otel-service-name : medanki-backend-prod
#   * apns-team-id : ABCDE12345
#   * apns-key-id : FGHIJ67890
#   * apns-private-key : -----BEGIN PRIVATE KEY-----...
#   * apns-bundle-id : dz.medanki.app
#   * google-oauth-client-id : xxx.apps.googleusercontent.com
#   * google-oauth-client-secret : GOCSPX-xxx
#   * fcm-service-account-json : {...}
#   * mail-smtp-host : smtp.sendgrid.net
#   * mail-smtp-user : apikey
#   * mail-smtp-password : SG.xxx
#   * mail-from : no-reply@medanki-dz.com
#   * jwt-entitlement-private-key : (pour signer les JWT entitlement)
#   * entitlement-jwt-public-key-path : /secrets/entitlement_public.pem

apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: medanki-prod
  annotations:
    # À remplacer par un secret ESO/SOPS en prod.
    secret-generator.medanki-dz.com/external-secret: "true"
type: Opaque
stringData:
  # Valeurs placeholder — NE JAMAIS COMMITTER DE VRAIES VALEURS.
  database-url: "postgres://medanki:CHANGE_ME@postgres-primary:5432/medanki"
  jwt-signing-key: "CHANGE_ME_PEM_PKCS8"
  jwt-public-key: "CHANGE_ME_PEM_SPKI"
  postgres-password: "CHANGE_ME"
  chargily-api-key: "pk_live_CHANGE_ME"
  chargily-api-secret: "sk_live_CHANGE_ME"
  sentry-dsn: "https://CHANGE_ME@sentry.io/CHANGE_ME"
  r2-access-key: "CHANGE_ME"
  r2-secret-key: "CHANGE_ME"
  apns-team-id: "CHANGE_ME"
  apns-key-id: "CHANGE_ME"
  apns-private-key: "CHANGE_ME"
  apns-bundle-id: "dz.medanki.app"
  google-oauth-client-id: "CHANGE_ME.apps.googleusercontent.com"
  google-oauth-client-secret: "CHANGE_ME"
  fcm-service-account-json: "CHANGE_ME"
  mail-smtp-host: "smtp.sendgrid.net"
  mail-smtp-user: "apikey"
  mail-smtp-password: "CHANGE_ME"
  mail-from: "no-reply@medanki-dz.com"
  entitlement-jwt-private-key: "CHANGE_ME_PEM_PKCS8"
