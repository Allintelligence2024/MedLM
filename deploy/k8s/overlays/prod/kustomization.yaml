apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: medanki-prod

resources:
  - ../../base
  - backup-cronjob.yaml

patches:
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 4
  - target:
      kind: Deployment
      name: cms
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: HorizontalPodAutoscaler
      name: backend-hpa
    patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 20
      - op: replace
        path: /spec/minReplicas
        value: 4
