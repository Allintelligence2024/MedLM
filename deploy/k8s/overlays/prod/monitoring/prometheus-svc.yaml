# Phase 17.1 — service Prometheus (déjà scrapé par le backend).
# On expose le service pour que Prometheus Operator (déploiement
# séparé, hors scope) puisse le découvrir via les annotations.
#
# Architecture cible :
#   * Prometheus scrape /v1/metrics toutes les 30s
#   * Alertmanager : alerte si 5xx rate > 1% ou P95 > 500ms
#   * Grafana : dashboards (livré séparément, Phase 18)
apiVersion: v1
kind: Service
metadata:
  name: backend-metrics
  namespace: medanki-prod
  labels:
    app: backend
    role: metrics
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"
    prometheus.io/path: "/v1/metrics"
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
