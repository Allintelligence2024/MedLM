# CronJob de détection de décrochage (Phase 19.2 / Phase 18.5).
#
# Stratégie prod :
#   * 2 exécutions par jour, 09:30 et 18:30 (heure d'Alger) — en plein
#     dans la fenêtre de notification autorisée 08:00-22:00. Le service
#     Reverifiera lui-même la fenêtre (double verrou).
#   * POST /v1/ai/retention/scan, rôle admin → le pod porte un JWT de
#     service LONGUE DURÉE signé RS256 (utilisateur de service avec
#     rbac_role='admin'), stocké dans backend-secrets/retention-cron-token
#     (rotation documentée dans SECURITY.md §Rotation).
#   * Pas de privilège K8s (démon HTTP sortant uniquement) — SA vide,
#     aucune règle RBAC.
#   * concurrencyPolicy: Forbid — jamais deux scans en parallèle.
#   * Active deadline 10 min (le scan pagine automatiquement à 500
#     utilisateurs/lot), restart OnFailure, backoff 2.
#   * Le scan est idempotent : un second passage dans la fenêtre ne
#     renvoie pas les mêmes alertes (cooldowns 7j/3j, Phase 18.5).

apiVersion: v1
kind: ServiceAccount
metadata:
  name: retention-cron
  namespace: medanki-prod
  annotations:
    description: "ServiceAccount du CronJob de rétention (détection de décrochage)"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: retention-scan
  labels:
    app: backend
    purpose: retention
    schedule: twice-daily
spec:
  # 09:30 et 18:30 Africa/Algiers — plein centre de la fenêtre 08:00-22:00.
  schedule: "30 9,18 * * *"
  timeZone: "Africa/Algiers"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 14
  startingDeadlineSeconds: 1800
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: backend
            purpose: retention
            schedule: twice-daily
        spec:
          serviceAccountName: retention-cron
          restartPolicy: OnFailure
          containers:
            - name: retention-scan
              image: curlimages/curl:8.10.1
              imagePullPolicy: IfNotPresent
              env:
                - name: BACKEND_URL
                  value: "http://backend:3000"
                - name: SCAN_PATH
                  value: "/v1/ai/retention/scan"
                - name: RETENTION_CRON_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: backend-secrets     # template : prod-secrets.yaml
                      key: retention-cron-token # JWT service admin longue durée
              resources:
                requests:
                  cpu: "50m"
                  memory: "32Mi"
                limits:
                  cpu: "200m"
                  memory: "64Mi"
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  echo "[$$(date -Iseconds)] Scan rétention : début"
                  if [ -z "$${RETENTION_CRON_TOKEN:-}" ]; then
                    echo "ERREUR: RETENTION_CRON_TOKEN absent (secret backend-secrets/retention-cron-token)"
                    exit 1
                  fi
                  # POST + récupération du code HTTP. 429 = fenêtre/limite,
                  # traité comme réussite contrôlée (loggé, pas d'échec job).
                  BODY=$$(curl -sS -w '\n%{http_code}' --max-time 120 \
                    -X POST "$${BACKEND_URL}$${SCAN_PATH}" \
                    -H "authorization: Bearer $${RETENTION_CRON_TOKEN}" \
                    -H "content-type: application/json" \
                    -d '{}')
                  CODE=$$(printf '%s' "$$BODY" | tail -n1)
                  echo "[$$(date -Iseconds)] Réponse HTTP $$CODE :"
                  printf '%s' "$$BODY" | head -n-1
                  case "$$CODE" in
                    200|201|204|429) echo "[$$(date -Iseconds)] Scan rétention : OK (deferred/outside_window acceptés)" ;;
                    *) echo "ERREUR: code inattendu $$CODE"; exit 1 ;;
                  esac
