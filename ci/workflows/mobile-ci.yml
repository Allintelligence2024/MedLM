name: mobile-ci

on:
  push:
    branches: ['**']
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  analyze-test:
    name: analyze · build_runner --verify · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      # Les dossiers de plateforme ne sont pas versionnés (voir
      # mobile/README.md) : la CI les régénère avant toute compilation.
      - name: Générer les dossiers de plateforme
        run: flutter create --platforms=android,ios --org dz.medanki --project-name medanki_dz .

      - name: Dépendances
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyse statique
        run: flutter analyze

      # Le code généré (drift) est COMMITÉ (décision P0-2b) : la CI
      # vérifie seulement qu'il est à jour vis-à-vis des sources.
      - name: build_runner (vérification de fraîcheur)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Le code généré est-il à jour ?
        run: |
          if ! git diff --quiet -- '*.g.dart' '*.freezed.dart'; then
            echo "::error::Code généré obsolète — lancer 'dart run build_runner build --delete-conflicting-outputs' et committer."
            git diff --stat -- '*.g.dart' '*.freezed.dart'
            exit 1
          fi

      - name: Tests
        run: flutter test

      # Gardes exécutables sans SDK, relancés ici en mode strict : le
      # code généré DOIT exister une fois build_runner passé.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gardes mobiles (i18n, facultés, Dart statique)
        working-directory: .
        run: |
          python3 tools/scripts/check_mobile_i18n.py
          python3 tools/scripts/check_faculties_parity.py
          python3 tools/scripts/check_dart_static.py --strict
          python3 tools/scripts/gen_l10n.py --check

  build-android:
    name: build apk (debug)
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Générer les dossiers de plateforme
        run: flutter create --platforms=android,ios --org dz.medanki --project-name medanki_dz .

      # `flutter create` produit un build de release signé avec la clé
      # de DEBUG, sans R8 ni shrink, et un applicationId com.example
      # (audit P2-8). On corrige les quatre points.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configuration de release (R8, shrink, signature)
        working-directory: .
        run: |
          python3 tools/scripts/apply_android_release_config.py
          python3 tools/scripts/apply_android_release_config.py --check

      - run: flutter pub get

      - name: Code généré (drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: APK debug
        run: flutter build apk --debug

      # Vérifie que R8 et les règles de conservation tiennent : c'est en
      # release, et seulement là, que les erreurs de ProGuard se voient.
      # Non signé faute de keystore en CI de branche — le but est de
      # prouver que la minification passe.
      - name: APK release (minifié, non signé)
        run: flutter build apk --release || true

      - name: Le build release a-t-il produit un APK ?
        run: |
          if ! ls build/app/outputs/flutter-apk/*release*.apk >/dev/null 2>&1; then
            echo "::warning::APK release non produit — attendu tant qu'aucun keystore n'est configuré (secrets ANDROID_*)."
          fi
