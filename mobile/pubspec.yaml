name: medanki_dz
description: "MedAnki DZ — Révise mieux, retiens plus, réussis en 1ère année."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # i18n (audit P1-4) : les chaînes UI étaient en dur en français.
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  # Phase 2 : persistance locale (source de vérité hors ligne).
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  path: ^1.9.0
  # DI (audit P1-5) : riverpod était déclaré sans jamais être importé.
  # La composition root vit désormais dans core/di/providers.dart.
  flutter_riverpod: ^2.5.1
  # Navigation déclarative (audit P0-2 : il n'y avait aucun routeur).
  go_router: ^14.2.0
  # Phase 8 : réseau + stockage sécurisé + background work.
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  workmanager: ^0.5.2
  # Phase 8 bis : crypto (vérif signature JWT + chiffrement decks).
  cryptography: ^2.7.0
  pointycastle: ^3.9.1
  # Phase 8 bis : connectivité (WorkManager conditionnel).
  connectivity_plus: ^6.0.5
  # Notifications push (audit P1-3) : aucun package FCM n'était déclaré,
  # aucun device token n'était remonté au backend.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3
  permission_handler: ^11.3.1
  # Version applicative envoyée au backend (X-App-Version) et affichée
  # dans l'écran Profil.
  package_info_plus: ^8.0.2
  # Paywall Chargily : ouverture du checkout dans le navigateur.
  url_launcher: ^6.3.0
  # Partage social ciblé (Phase 15.5).
  share_plus: ^10.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  test: ^1.25.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9
  # Audit P1-5 : mocktail et fake_async étaient en `dependencies` —
  # donc embarqués dans l'APK de production. Ce sont des helpers de test.
  mocktail: ^1.0.4
  fake_async: ^1.3.1
  # Icônes et splash natifs (audit P2-8) : les assets par défaut Flutter
  # étaient encore en place.
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  generate: true # active la génération de AppLocalizations (l10n.yaml)
  assets:
    - assets/content/
    # Phase 8 bis : clé publique RS256 du serveur pour la
    # vérification offline du JWT d'entitlement (v2 §8.1).
    - assets/keys/
    - assets/branding/

# ── Icône de lancement (audit P2-8) ─────────────────────────────────────────
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/branding/app_icon.png"
  adaptive_icon_background: "#0F766E"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  remove_alpha_ios: true

# ── Splash natif (audit P2-8) ───────────────────────────────────────────────
flutter_native_splash:
  color: "#0F766E"
  image: "assets/branding/splash.png"
  android_12:
    color: "#0F766E"
    image: "assets/branding/splash.png"
  android: true
  ios: true
