name: medanki_dz
description: "MedAnki DZ — Révise mieux, retiens plus, réussis en 1ère année."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Phase 2 : persistance locale (source de vérité hors ligne).
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  path: ^1.9.0
  # Phase 4 : DI.
  flutter_riverpod: ^2.5.1
  # Phase 8 : réseau + stockage sécurisé + background work.
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  workmanager: ^0.5.2
  # UUID v7 (le projet a sa propre implémentation ; on garde quand
  # même le package pour les usages utilitaires).
  uuid: ^4.5.0
  # Tests helpers.
  fake_async: ^1.3.1
  mocktail: ^1.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  test: ^1.25.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/content/
