name: medanki_dz
description: "MedAnki DZ — Révise mieux, retiens plus, réussis en 1ère année."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Phase 2 : persistance locale (source de vérité hors ligne).
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  path: ^1.9.0
  # Phases suivantes :
  #   Phase 4 : flutter_riverpod
  #   Phase 8 : dio, flutter_secure_storage, workmanager

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  test: ^1.25.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    # Contenu versionné, validé en CI par tools/validate_content.py.
    - assets/content/
