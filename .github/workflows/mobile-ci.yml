name: mobile-ci

on:
  push:
    branches: ['**']
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  analyze-test:
    name: analyze · build_runner --verify · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      - name: Dépendances
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyse statique
        run: flutter analyze

      # Le code généré (drift) est COMMITÉ (décision P0-2b) : la CI
      # vérifie seulement qu'il est à jour vis-à-vis des sources.
      - name: build_runner (vérification de fraîcheur)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Le code généré est-il à jour ?
        run: |
          if ! git diff --quiet -- '*.g.dart' '*.freezed.dart'; then
            echo "::error::Code généré obsolète — lancer 'dart run build_runner build --delete-conflicting-outputs' et committer."
            git diff --stat -- '*.g.dart' '*.freezed.dart'
            exit 1
          fi

      - name: Tests
        run: flutter test

  build-android:
    name: build apk (debug)
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: APK debug
        run: flutter build apk --debug
