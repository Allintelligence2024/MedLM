name: backend-ci

on:
  push:
    branches: ['**']
    paths:
      - 'backend/**'
      - 'tools/scripts/**'
      - 'mobile/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'tools/scripts/**'
      - 'mobile/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  static:
    name: typecheck · lint · unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: TypeScript (tsc --noEmit)
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm run test

      - name: Nest build
        run: npm run build

      # Le build peut « réussir » sans produire dist/main.js (la racine
      # de sortie glisse si tsconfig inclut test/). On démarre donc
      # réellement le binaire — c'est ce qui manquait quand le bug est
      # passé jusqu'à l'image Docker.
      - name: Démarrage du binaire compilé
        working-directory: .
        run: ./tools/scripts/check_build_artifact.sh


  mobile:
    name: mobile (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Créer les plateformes natives absentes
        working-directory: mobile
        run: flutter create --platforms=android .
      - name: Dépendances Flutter
        working-directory: mobile
        run: flutter pub upgrade
      - name: Code généré
        working-directory: mobile
        run: |
          set +e
          flutter pub run build_runner build --delete-conflicting-outputs 2>&1 | tee /tmp/codegen.log
          status=${PIPESTATUS[0]}
          while IFS= read -r line; do
            echo "::error file=mobile/lib/data/local/app_database.dart::$line"
          done < /tmp/codegen.log
          exit "$status"
      - name: Analyse statique
        working-directory: mobile
        run: flutter analyze
      - name: Tests
        working-directory: mobile
        run: flutter test
      - name: APK debug
        working-directory: mobile
        run: flutter build apk --debug

  integration:
    name: integration (postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medanki
          POSTGRES_PASSWORD: medanki
          POSTGRES_DB: medanki_dz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medanki -d medanki_dz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://medanki:medanki@localhost:5432/medanki_dz
      # Schéma jetable par run — isole les tests (cf. database.module.ts).
      PG_SCHEMA: ci_${{ github.run_id }}
      NODE_ENV: test
      LOG_LEVEL: error
      AI_LLM_PROVIDER: mock
      AI_TRANSCRIBER_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Clés RS256 éphémères (JWT)
        run: |
          mkdir -p keys
          openssl genrsa -out keys/jwt-private.pem 2048
          openssl rsa -in keys/jwt-private.pem -pubout -out keys/jwt-public.pem

      - name: Créer le schéma jetable
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE SCHEMA IF NOT EXISTS \"$PG_SCHEMA\";"

      - name: Migrations
        run: npm run db:migrate

      - name: Seed de test (idempotent)
        run: npm run db:seed

      - name: Contrat PostgreSQL (script bash)
        working-directory: .
        run: ./tools/scripts/check_database_contract.sh

      - name: Tests d'intégration
        run: npm run test:integration

      # Parcours métier contre le binaire RÉEL et la vraie base : c'est
      # ce qui manquait quand trois pannes bloquantes (sync en 500,
      # 401 généralisé, rotation inopérante) ont survécu à 531 tests.
      - name: Build pour le test de parcours
        run: npm run build

      - name: Parcours métier de bout en bout
        working-directory: .
        run: ./tools/scripts/check_business_flows.sh

      - name: Nettoyer le schéma
        if: always()
        run: psql "$DATABASE_URL" -c "DROP SCHEMA IF EXISTS \"$PG_SCHEMA\" CASCADE;" || true

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Validation statique d'abord : un COPY --from vers une étape
      # inexistante ou un healthcheck sondant une route absente coûte
      # moins cher à détecter ici qu'après un build de 3 minutes.
      - name: Validation statique des Dockerfiles
        working-directory: .
        run: |
          pip install --quiet PyYAML
          python3 tools/scripts/check_dockerfiles.py

      - name: Build de l'image backend
        run: docker build -f backend/Dockerfile -t medanki/backend:ci .
        working-directory: .

  verify-scripts:
    name: verify scripts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          if [ -f tools/requirements.txt ]; then pip install -r tools/requirements.txt; fi
      - name: Check workflows
        run: python3 tools/scripts/check_workflows.py
      - name: Bash syntax guard
        run: |
          bash -n tools/scripts/check_database_contract.sh
          bash -n tools/scripts/check_business_flows.sh
