name: mobile-debug

# Workflow temporaire de diagnostic (workflow_dispatch uniquement).
# Il exécute analyse + tests Flutter puis publie le détail des échecs
# dans la branche d'artefacts `ci-artifacts`, seule voie lisible depuis
# l'environnement d'audit (logs Actions non accessibles).
on:
  workflow_dispatch:
  push:
    # Uniquement la branche de travail : la branche d'artefacts
    # `ci-artifacts` ne doit pas relancer ce workflow.
    branches: ['arena/01a03782-medlm']

permissions:
  contents: write

defaults:
  run:
    working-directory: mobile

jobs:
  diagnose:
    name: mobile failures detail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Préparer le projet
        run: |
          flutter create --platforms=android . >/dev/null 2>&1 || true
          rm -f test/widget_test.dart
          flutter pub upgrade
          dart run build_runner build --build-filter=lib/data/local/app_database.g.dart
      - name: Analyse statique
        run: |
          set +e
          flutter analyze > /tmp/analyze.txt 2>&1
          echo "analyze_exit=$?"
      - name: Tests (rapport JSON)
        run: |
          set +e
          flutter test --reporter json > /tmp/tests.json 2>/tmp/tests.err
          echo "test_exit=$?"
      - name: APK debug
        if: always()
        run: |
          set +e
          flutter build apk --debug > /tmp/apk.txt 2>&1
          echo "apk_exit=$?"
      - name: Construire le rapport
        if: always()
        working-directory: .
        run: |
          python3 tools/scripts/flutter_ci_report.py \
            --analyze /tmp/analyze.txt \
            --json /tmp/tests.json \
            --stderr /tmp/tests.err \
            --out /tmp/report.md
          if [ -f /tmp/apk.txt ]; then
            printf '\n## flutter build apk --debug\n\n```\n%s\n```\n' \
              "$(tail -c 4000 /tmp/apk.txt)" >> /tmp/report.md
          fi
      - name: Publier le rapport
        if: always()
        working-directory: .
        continue-on-error: true
        run: |
          mkdir -p /tmp/pub && cp /tmp/report.md /tmp/pub/report.md
          cd /tmp/pub
          git init -q -b ci-artifacts
          git config user.email "ci@medlm.local"
          git config user.name "mobile-debug"
          git add report.md
          git commit -q -m "ci: flutter diagnostics for $GITHUB_SHA"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            ci-artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
